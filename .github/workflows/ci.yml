name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.13.1
      - run: ruff check nupson tests
      - run: ruff format --check nupson tests
      - run: python -m compileall -q nupson
      - run: python -m unittest discover -s tests -v
      - run: docker compose config -q


  windows-client-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate generated PowerShell templates
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem nupson/templates/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
