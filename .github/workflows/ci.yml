name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.13.1
      - run: ruff check nupson tests
      - run: ruff format --check nupson tests
      - run: python -m compileall -q nupson
      - run: python -m unittest discover -s tests -v
      - run: docker compose config -q
