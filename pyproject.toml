[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nupson"
version = "0.1.1"
description = "Lightweight NUT server and power-recovery Wake-on-LAN appliance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "NUPSON contributors" }]
dependencies = []

[project.scripts]
nupson = "nupson.app:main"

[tool.setuptools]
packages = ["nupson"]

[tool.setuptools.package-data]
nupson = ["web/*", "web/icons/*", "web/assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
